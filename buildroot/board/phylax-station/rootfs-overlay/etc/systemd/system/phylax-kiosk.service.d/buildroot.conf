# PHYLAX station (Buildroot image): the kiosk unit is the Raspberry Pi OS image's (the repo's
# rootfs/); Buildroot has no system-wide language setting, so PHYLAX Suite gets it here.
[Service]
Environment=LANG=en_US.UTF-8
# The front status LED: steady while PHYLAX Suite runs, blinking again when it stops (crash and
# restart, or shut down). "+": as root (the LED is in /sys), "-": a failure never stops the kiosk.
ExecStartPost=-+/usr/local/sbin/phylax-status-led ready
ExecStopPost=-+/usr/local/sbin/phylax-status-led starting
